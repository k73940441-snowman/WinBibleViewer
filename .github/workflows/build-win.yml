name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller and Pillow
        run: pip install pyinstaller pillow
      - name: Convert PNG to ICO
        run: python -c "from PIL import Image; img = Image.open('icon.png').convert('RGBA'); img.save('icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"
      - name: Build Windows Executable
        run: pyinstaller --noconsole --onefile --icon=icon.ico --add-data "icon.png;." --name BibleDbViewer viewer.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BibleDbViewer-Windows
          path: dist/BibleDbViewer.exe
